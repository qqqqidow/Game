<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여름 텃밭</title>
<meta name="description" content="밀짚모자 친구와 함께 가꾸는 여름 텃밭">
<meta name="theme-color" content="#6cc24a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여름 텃밭">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" as="image" href="assets/bg.webp" type="image/webp">
<style>
:root{
  --sky:#3aa0f0;
  --leaf:#6cc24a;
  --leaf-deep:#3f8f2a;
  --straw:#e6c27a;
  --denim:#3f6aa8;
  --denim-deep:#2c4d80;
  --cream:#fff8e6;
  --ink:#27382a;
  --font:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Pretendard",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#8ccbf5;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img{-webkit-user-drag:none;user-drag:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--denim)}

.screen{position:fixed;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}

/* ---------- start screen ---------- */
#start .shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(18,70,130,.38) 0%,rgba(18,70,130,0) 34%,rgba(255,248,230,0) 55%,rgba(30,60,20,.34) 100%)}
.start-wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + clamp(18px,5vh,56px)) 20px calc(var(--safe-b) + clamp(18px,5vh,48px))}
.title{margin:0;text-align:center;color:#fff;font-weight:900;letter-spacing:-.03em;line-height:1;
  font-size:clamp(40px,min(15vw,11vh),92px);white-space:nowrap;text-shadow:0 3px 0 var(--denim-deep),0 8px 24px rgba(20,60,120,.45)}
.subtitle{margin:10px 0 0;text-align:center;color:var(--cream);font-weight:700;font-size:clamp(14px,2.3vh,19px);text-shadow:0 2px 10px rgba(20,60,120,.6)}
.pick{width:100%;max-width:780px}
.pick-label{margin:0 0 clamp(6px,1.6vh,14px);text-align:center;color:#fff;font-weight:800;font-size:clamp(14px,2.4vh,18px);text-shadow:0 2px 10px rgba(20,60,120,.7)}
.pick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,22px);align-items:end}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:clamp(8px,1.6vh,16px) 6px 0;border-radius:28px;
  background:rgba(255,255,255,.34);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:3px solid rgba(255,255,255,.55);transition:transform .22s cubic-bezier(.3,1.5,.5,1),background .2s,border-color .2s,box-shadow .2s}
.card img{display:block;width:100%;height:auto;aspect-ratio:4/5;max-height:34vh;object-fit:contain;object-position:50% 100%;filter:saturate(.9) brightness(.97);transition:filter .2s}
.card .nm{align-self:stretch;margin:8px -3px -3px;padding:8px 0 9px;border-radius:0 0 25px 25px;text-align:center;font-weight:900;
  font-size:clamp(14px,2.3vh,19px);background:rgba(255,255,255,.7);color:var(--denim-deep);transition:background .2s,color .2s}
.card[aria-checked="true"]{transform:translateY(-10px) scale(1.04);background:rgba(255,255,255,.82);border-color:#fff;
  box-shadow:0 14px 30px rgba(20,60,20,.35)}
.card[aria-checked="true"] img{filter:none}
.card[aria-checked="true"] .nm{background:var(--denim);color:#fff}
.go{display:block;margin:clamp(12px,3vh,26px) auto 0;min-width:min(78vw,300px);padding:clamp(14px,2.4vh,20px) 28px;border-radius:999px;
  background:var(--leaf);color:#fff;font-weight:900;font-size:clamp(18px,3vh,24px);letter-spacing:-.01em;
  box-shadow:0 6px 0 var(--leaf-deep),0 16px 26px rgba(20,60,20,.35);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--leaf-deep),0 6px 12px rgba(20,60,20,.3)}
.best{margin:12px 0 0;text-align:center;color:#fff;font-weight:700;font-size:14px;text-shadow:0 2px 8px rgba(20,60,20,.7)}

/* ---------- play screen ---------- */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
#world{position:absolute;left:0;top:0;will-change:transform}
#world .scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#play .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,70,130,.2) 0,rgba(18,70,130,0) 20%,rgba(30,60,20,0) 70%,rgba(30,60,20,.18) 100%)}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(var(--safe-t) + 12px) 14px 0;z-index:30;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 12px;border-radius:999px;background:rgba(255,248,230,.92);
  font-weight:900;font-size:18px;color:var(--ink);box-shadow:0 4px 0 rgba(63,106,168,.35)}
.pill small{font-size:12px;font-weight:700;color:#5d6e5a}
.pill svg{width:26px;height:26px}
.back{width:46px;height:46px;border-radius:50%;background:rgba(255,248,230,.92);display:grid;place-items:center;box-shadow:0 4px 0 rgba(63,106,168,.35)}
.back svg{width:22px;height:22px}
.pill.bump{animation:bump .35s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{40%{transform:scale(1.14)}}

/* edge arrows: walk to the next place */
.edge{position:absolute;top:50%;z-index:25;display:flex;align-items:center;gap:4px;height:48px;padding:0 14px;border-radius:999px;
  background:rgba(255,248,230,.92);font-weight:900;font-size:15px;color:var(--denim-deep);box-shadow:0 4px 0 rgba(63,106,168,.35);animation:nudge 1.3s ease-in-out infinite}
.edge svg{width:20px;height:20px}
#edgeR{right:calc(10px + env(safe-area-inset-right,0px))}
#edgeL{left:calc(10px + env(safe-area-inset-left,0px));flex-direction:row-reverse;animation-name:nudgeL}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes nudgeL{50%{transform:translateX(-5px)}}

/* soil patch (painted in the background): one tap target */
#patch{position:absolute;z-index:2000;border-radius:18px}
#patch.hint{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.75),0 0 22px 6px rgba(255,248,230,.8)}}
.slot{position:absolute;left:0;top:0;width:var(--pw);height:var(--pw);pointer-events:none}
.slot .plant{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.plant>g{display:none}
.slot[data-s="1"] .g-seed{display:block}
.slot[data-s="2"] .g-sprout{display:block;transform-origin:50px 88px;transform:scale(calc(.45 + var(--p,0)*.75))}
.slot[data-s="3"] .g-ripe{display:block;transform-origin:50px 88px;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{from{transform:scale(.6)}}
.cue{position:absolute;left:50%;top:-18%;transform:translateX(-50%);padding:3px 9px;border-radius:999px;background:var(--cream);
  font-weight:900;font-size:12px;white-space:nowrap;box-shadow:0 3px 0 rgba(63,106,168,.35);color:var(--denim-deep);display:none;animation:hover 1.1s ease-in-out infinite}
.slot[data-s="1"] .cue,.slot[data-s="3"] .cue{display:block}
.slot[data-s="3"] .cue{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-deep)}
@keyframes hover{50%{transform:translateX(-50%) translateY(-4px)}}
.bar{position:absolute;left:18%;right:18%;bottom:-6%;height:6px;border-radius:9px;background:rgba(255,255,255,.65);overflow:hidden;display:none}
.slot[data-s="2"] .bar{display:block}
.bar i{display:block;height:100%;width:calc(var(--p,0)*100%);background:#58b8f0;border-radius:9px}
.drops{position:absolute;left:50%;top:-10%;width:90%;height:60%;transform:translateX(-50%);pointer-events:none}
.drops i{position:absolute;top:0;width:7px;height:11px;border-radius:50% 50% 50% 50%/65% 65% 40% 40%;background:#58b8f0;opacity:0;animation:fall .7s ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(40px)}}
.float{position:absolute;left:50%;top:-10%;transform:translateX(-50%);font-weight:900;font-size:22px;color:#fff;pointer-events:none;
  text-shadow:0 2px 0 var(--leaf-deep),0 0 14px rgba(40,100,20,.6);animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}

/* character */
#hero{position:absolute;left:0;top:0;pointer-events:none;--hh:120px}
#hero .shd{position:absolute;left:0;top:0;width:calc(var(--hh)*.6);height:calc(var(--hh)*.13);transform:translate(-50%,-50%);border-radius:50%;background:rgba(30,40,10,.28);filter:blur(2px)}
#hero .body{position:absolute;left:0;top:0;transform:translate(-50%,-97%);transform-origin:50% 100%}
#hero img{display:block;height:var(--hh);width:auto}
#hero.walk .body{animation:step .36s ease-in-out infinite}
@keyframes step{0%,100%{transform:translate(-50%,-97%) rotate(0)}25%{transform:translate(-50%,-106%) rotate(-4deg)}75%{transform:translate(-50%,-106%) rotate(4deg)}}
#hero.cheer .body{animation:cheer .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes cheer{0%{transform:translate(-50%,-97%) scale(1,1)}30%{transform:translate(-50%,-97%) scale(1.08,.9)}60%{transform:translate(-50%,-135%) scale(.94,1.08)}100%{transform:translate(-50%,-97%) scale(1,1)}}
#say{position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%) scale(.9);padding:7px 13px;border-radius:16px;background:#fff;
  font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 4px 0 rgba(63,106,168,.3);opacity:0;transition:opacity .2s,transform .2s;color:var(--ink)}
#say.on{opacity:1;transform:translateX(-50%) scale(1)}
#say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff}

#veil{position:absolute;inset:0;z-index:40;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .25s}
#veil.on{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- 시작 화면 -->
<main id="start" class="screen">
  <img class="bg" src="assets/bg.webp" alt="" draggable="false">
  <div class="shade"></div>
  <div class="start-wrap">
    <header>
      <h1 class="title">여름 텃밭</h1>
      <p class="subtitle">밀짚모자 친구와 콩을 길러요</p>
    </header>
    <section class="pick" aria-labelledby="pick-label">
      <p class="pick-label" id="pick-label">함께할 친구를 골라요</p>
      <div class="pick-row" id="pickRow" role="radiogroup" aria-labelledby="pick-label"></div>
      <button class="go" id="goBtn" type="button">시작하기</button>
      <p class="best" id="bestLine" hidden></p>
    </section>
  </div>
</main>

<!-- 게임 화면 -->
<section id="play" class="screen" hidden>
  <div id="stage">
    <div id="world">
      <img class="scene" id="scene0" src="assets/bg.webp" alt="" draggable="false">
      <img class="scene" id="scene1" src="assets/bg2.webp" alt="" draggable="false" hidden>
      <div id="slots"></div>
      <button id="patch" type="button" aria-label="밭: 씨앗 심기, 물 주기, 수확하기" hidden></button>
      <div id="hero">
        <span class="shd"></span>
        <div class="body"><div id="say"></div><img id="heroImg" alt="" draggable="false"></div>
      </div>
    </div>
  </div>
  <div class="shade"></div>
  <div class="hud">
    <button class="back" id="backBtn" type="button" aria-label="친구 다시 고르기">
      <svg viewBox="0 0 24 24" fill="none" stroke="#27382a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="pill" id="score" aria-live="polite">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(-28 16 16)"><rect x="4" y="11" width="24" height="10" rx="5" fill="#6cc24a" stroke="#3f8f2a" stroke-width="2"/><circle cx="10" cy="16" r="1.7" fill="#3f8f2a"/><circle cx="16" cy="16" r="1.7" fill="#3f8f2a"/><circle cx="22" cy="16" r="1.7" fill="#3f8f2a"/></g></svg>
      <span id="sessionN">0</span><small id="totalN">누적 0</small>
    </div>
  </div>
  <button class="edge" id="edgeR" type="button">밭으로
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="edge" id="edgeL" type="button" hidden>마당으로
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div id="veil"></div>
</section>

<script>
(() => {
  const CHARS = [
    { id: 'chiikawa',  name: '치이카와', src: 'assets/chiikawa.webp'  },
    { id: 'hachiware', name: '하치와레', src: 'assets/hachiware.webp' },
    { id: 'usagi',     name: '우사기',   src: 'assets/usagi.webp'     }
  ];

  /* 장면: 0 = 마당(시작), 1 = 텃밭(오른쪽 끝으로 가면 나옴)
     좌표는 그림 크기에 대한 비율(0~1) */
  const SCENES = [
    { nw: 1672, nh: 940, vmin: 0.72, vmax: 0.97 },
    { nw: 1670, nh: 942, vmin: 0.56, vmax: 0.97 }
  ];
  // 텃밭 그림 속에 이미 그려진 갈색 땅
  const PATCH = { u0: 0.145, u1: 0.265, v0: 0.515, v1: 0.59 };
  const SLOTS = [{ u: 0.170, v: 0.572 }, { u: 0.205, v: 0.572 }, { u: 0.240, v: 0.572 }];
  const STAND = { u: 0.315, v: 0.60 };   // 친구가 밭 일을 할 때 서는 자리
  const GROW_MS = 5200;

  const $ = s => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('summer-garden.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('summer-garden.' + k, JSON.stringify(v)); } catch {} }
  };

  let sel = store.get('char', 'chiikawa');
  if (!CHARS.some(c => c.id === sel)) sel = 'chiikawa';
  let total = store.get('total', 0);
  let session = 0;

  const start = $('#start'), play = $('#play');

  /* ---------- 시작 화면: 캐릭터 고르기 ---------- */
  const row = $('#pickRow');
  CHARS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.dataset.id = c.id;
    b.setAttribute('role', 'radio');
    b.innerHTML = `<img src="${c.src}" alt="" draggable="false"><span class="nm">${c.name}</span>`;
    b.addEventListener('click', () => choose(c.id));
    row.appendChild(b);
  });
  function choose(id) {
    sel = id; store.set('char', id);
    row.querySelectorAll('.card').forEach(el => el.setAttribute('aria-checked', String(el.dataset.id === id)));
  }
  choose(sel);
  function showBest() {
    const el = $('#bestLine');
    if (total > 0) { el.hidden = false; el.textContent = `지금까지 콩 ${total}개를 땄어요`; } else el.hidden = true;
  }
  showBest();

  /* ---------- 게임 화면 ---------- */
  const stage = $('#stage'), world = $('#world');
  const imgs = [$('#scene0'), $('#scene1')];
  const heroEl = $('#hero'), say = $('#say');
  const patchEl = $('#patch'), slotsEl = $('#slots');
  const edgeR = $('#edgeR'), edgeL = $('#edgeL'), veil = $('#veil');

  let scene = 0;
  let vw = 0, vh = 0, W = 0, H = 0, top = 0;
  let cam = 0;
  const hero = { u: 0.45, v: 0.88 };
  let target = null, pending = false, transitioning = false, playing = false;
  let lastT = 0, rafId = 0, sayTimer = null, tickTimer = null;

  const plantSVG = `
    <svg class="plant" viewBox="0 0 100 100" aria-hidden="true">
      <g class="g-seed">
        <ellipse cx="50" cy="86" rx="13" ry="6" fill="#6b4228"/>
        <ellipse cx="45" cy="83" rx="4" ry="2.6" fill="#e6c27a"/><ellipse cx="56" cy="85" rx="4" ry="2.6" fill="#e6c27a"/>
      </g>
      <g class="g-sprout">
        <path d="M50 88 C50 74 50 66 51 58" stroke="#4a9a32" stroke-width="5" stroke-linecap="round" fill="none"/>
        <ellipse cx="38" cy="58" rx="14" ry="8" fill="#7fd157" stroke="#3f8f2a" stroke-width="2.5" transform="rotate(-28 38 58)"/>
        <ellipse cx="63" cy="55" rx="14" ry="8" fill="#6cc24a" stroke="#3f8f2a" stroke-width="2.5" transform="rotate(28 63 55)"/>
      </g>
      <g class="g-ripe">
        <path d="M50 90 C48 70 52 52 50 34" stroke="#4a9a32" stroke-width="5" stroke-linecap="round" fill="none"/>
        <ellipse cx="32" cy="46" rx="17" ry="9" fill="#7fd157" stroke="#3f8f2a" stroke-width="2.5" transform="rotate(-30 32 46)"/>
        <ellipse cx="68" cy="42" rx="17" ry="9" fill="#6cc24a" stroke="#3f8f2a" stroke-width="2.5" transform="rotate(30 68 42)"/>
        <ellipse cx="50" cy="26" rx="14" ry="8" fill="#8be05f" stroke="#3f8f2a" stroke-width="2.5" transform="rotate(-8 50 26)"/>
        <g transform="rotate(14 34 66)"><rect x="20" y="60" width="28" height="12" rx="6" fill="#6cc24a" stroke="#3f8f2a" stroke-width="2.5"/><circle cx="29" cy="66" r="1.8" fill="#3f8f2a"/><circle cx="39" cy="66" r="1.8" fill="#3f8f2a"/></g>
        <g transform="rotate(-16 66 70)"><rect x="52" y="64" width="28" height="12" rx="6" fill="#6cc24a" stroke="#3f8f2a" stroke-width="2.5"/><circle cx="61" cy="70" r="1.8" fill="#3f8f2a"/><circle cx="71" cy="70" r="1.8" fill="#3f8f2a"/></g>
      </g>
    </svg>`;

  // 밭 칸 3개: 그림 속 갈색 땅 위에 심겨요 (따로 그린 밭 없음)
  const slots = SLOTS.map((pos, i) => {
    const el = document.createElement('div');
    el.className = 'slot'; el.dataset.s = '0';
    el.innerHTML = `${plantSVG}<span class="cue"></span><span class="bar"><i></i></span>`;
    el.hidden = true;
    slotsEl.appendChild(el);
    return { el, s: 0, t0: 0, pos };
  });
  const CUE = { 1: '물 주기', 3: '수확!' };
  function setSlot(i, s) {
    const p = slots[i];
    p.s = s; p.el.dataset.s = String(s);
    if (s === 2) p.t0 = performance.now();
    p.el.style.setProperty('--p', 0);
    p.el.querySelector('.cue').textContent = CUE[s] || '';
    patchEl.classList.toggle('hint', slots.every(x => x.s === 0));
  }

  /* ----- 화면 크기에 맞춰 장면 배치 (바닥 기준, 가로로 넘치면 카메라가 따라감) ----- */
  function layout() {
    vw = innerWidth; vh = innerHeight;
    const sc = SCENES[scene];
    const s = Math.max(vw / sc.nw, vh / sc.nh);
    W = sc.nw * s; H = sc.nh * s; top = vh - H;
    world.style.width = W + 'px'; world.style.height = H + 'px'; world.style.top = top + 'px';
    world.style.setProperty('--pw', (H * 0.072).toFixed(1) + 'px');
    slots.forEach(p => {
      p.el.style.transform = `translate(${(p.pos.u * W).toFixed(1)}px,${(p.pos.v * H).toFixed(1)}px) translate(-50%,-88%)`;
      p.el.style.zIndex = Math.round(p.pos.v * 1000);
    });
    const pad = Math.max(6, H * 0.012);
    patchEl.style.left = (PATCH.u0 * W - pad) + 'px';
    patchEl.style.top = (PATCH.v0 * H - pad - H * 0.05) + 'px';
    patchEl.style.width = ((PATCH.u1 - PATCH.u0) * W + pad * 2) + 'px';
    patchEl.style.height = ((PATCH.v1 - PATCH.v0) * H + pad * 2 + H * 0.05) + 'px';
    renderHero();
    applyCam(true);
  }
  function renderHero() {
    const sc = SCENES[scene];
    const t = clamp((hero.v - sc.vmin) / (sc.vmax - sc.vmin), 0, 1);
    heroEl.style.setProperty('--hh', (H * (0.17 + 0.09 * t)).toFixed(1) + 'px');
    heroEl.style.transform = `translate(${(hero.u * W).toFixed(1)}px,${(hero.v * H).toFixed(1)}px)`;
    heroEl.style.zIndex = Math.round(hero.v * 1000);
  }
  function applyCam(jump, dt = 0) {
    // 밭 장면에서는 친구가 밭 근처에 있을 때 갈색 땅이 화면 안에 들어오도록 카메라를 밭 쪽으로 당겨요
    let focus = hero.u;
    if (scene === 1) { const w = clamp((0.5 - hero.u) / 0.2, 0, 1); focus = hero.u * (1 - w) + 0.215 * w; }
    const goal = clamp(focus * W - vw / 2, 0, Math.max(0, W - vw));
    cam = jump ? goal : cam + (goal - cam) * Math.min(1, dt * 6);
    world.style.transform = `translateX(${(-cam).toFixed(1)}px)`;
    const maxCam = Math.max(0, W - vw);
    edgeR.style.display = ''; edgeL.style.display = '';
    edgeR.hidden = !(scene === 0 && cam >= maxCam - 60);
    edgeL.hidden = !(scene === 1 && cam <= 60);
  }

  /* ----- 말풍선 / 연출 ----- */
  function speak(t, ms = 1700) {
    say.textContent = t; say.classList.add('on');
    clearTimeout(sayTimer); sayTimer = setTimeout(() => say.classList.remove('on'), ms);
  }
  function kick(cls, ms) {
    heroEl.classList.remove('cheer'); void heroEl.offsetWidth;
    heroEl.classList.add(cls); setTimeout(() => heroEl.classList.remove(cls), ms);
  }

  /* ----- 이동 ----- */
  function walkTo(u, v) {
    const sc = SCENES[scene];
    target = { u: clamp(u, 0.01, 0.99), v: clamp(v, sc.vmin, sc.vmax) };
    pending = false;
  }
  stage.addEventListener('pointerdown', e => {
    if (!playing || transitioning) return;
    if (e.target.closest('#patch')) return;
    walkTo((e.clientX + cam) / W, (e.clientY - top) / H);
  });
  edgeR.addEventListener('click', () => { if (!transitioning) walkTo(0.99, hero.v); });
  edgeL.addEventListener('click', () => { if (!transitioning) walkTo(0.01, hero.v); });

  function frame(t) {
    rafId = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
    if (!playing) return;
    let moving = false;
    if (target && !transitioning) {
      const dx = (target.u - hero.u) * W, dy = (target.v - hero.v) * H;
      const d = Math.hypot(dx, dy);
      const sp = (0.18 * W + 120) * dt;
      if (d <= sp) {
        hero.u = target.u; hero.v = target.v; target = null;
        if (pending) { pending = false; patchAction(); }
      } else {
        hero.u += dx / d * sp / W; hero.v += dy / d * sp / H; moving = true;
      }
      renderHero();
      if (scene === 0 && hero.u >= 0.965 && moving) goScene(1);
      else if (scene === 1 && hero.u <= 0.035 && moving) goScene(0);
    }
    heroEl.classList.toggle('walk', moving);
    applyCam(false, dt);
  }

  /* ----- 장면 전환: 마당의 오른쪽 끝 → 텃밭, 텃밭의 왼쪽 끝 → 마당 ----- */
  function goScene(to) {
    transitioning = true; target = null; pending = false;
    heroEl.classList.remove('walk');
    veil.classList.add('on');
    setTimeout(() => {
      scene = to;
      imgs.forEach((im, i) => im.hidden = i !== to);
      slots.forEach(p => p.el.hidden = to !== 1);
      patchEl.hidden = to !== 1;
      const sc = SCENES[to];
      hero.u = to === 1 ? 0.05 : 0.95;
      hero.v = clamp(hero.v, sc.vmin, sc.vmax);
      if (to === 1) hero.v = 0.70;
      layout();
      veil.classList.remove('on');
      setTimeout(() => {
        transitioning = false;
        speak(to === 1 ? '밭이다! 갈색 땅을 눌러요' : '마당으로 돌아왔어요', 2400);
      }, 260);
    }, 270);
  }

  /* ----- 밭 일: 갈색 땅을 누르면 상황에 맞는 일을 해요 ----- */
  patchEl.addEventListener('click', () => {
    if (!playing || transitioning) return;
    const near = Math.abs(hero.u - STAND.u) < 0.045 && Math.abs(hero.v - STAND.v) < 0.05;
    if (near) { target = null; patchAction(); }
    else { target = { u: STAND.u, v: STAND.v }; pending = true; }
  });
  function patchAction() {
    let i = slots.findIndex(p => p.s === 3);
    if (i >= 0) return harvest(i);
    i = slots.findIndex(p => p.s === 1);
    if (i >= 0) { water(i); setSlot(i, 2); speak('쑥쑥 자라라!'); return; }
    i = slots.findIndex(p => p.s === 0);
    if (i >= 0) { setSlot(i, 1); speak('씨앗을 심었어요'); return; }
    speak('아직 자라는 중이에요');
  }
  function water(i) {
    const d = document.createElement('span'); d.className = 'drops';
    d.innerHTML = '<i style="left:12%;animation-delay:0s"></i><i style="left:45%;animation-delay:.1s"></i><i style="left:76%;animation-delay:.2s"></i>';
    slots[i].el.appendChild(d); setTimeout(() => d.remove(), 1000);
  }
  function harvest(i) {
    setSlot(i, 0);
    session++; total++; store.set('total', total);
    renderScore(true);
    kick('cheer', 520);
    const f = document.createElement('span'); f.className = 'float'; f.textContent = '+1';
    slots[i].el.appendChild(f); setTimeout(() => f.remove(), 950);
    const lines = ['맛있겠다!', '콩이 통통해요', '잘 땄어요!', '한 개 더!'];
    speak(session % 10 === 0 ? `벌써 ${session}개째!` : lines[session % lines.length]);
  }
  function renderScore(bump) {
    $('#sessionN').textContent = session;
    $('#totalN').textContent = `누적 ${total}`;
    if (bump) { const s = $('#score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  }
  function tick() {
    const now = performance.now();
    slots.forEach((p, i) => {
      if (p.s !== 2) return;
      const k = Math.min(1, (now - p.t0) / GROW_MS);
      p.el.style.setProperty('--p', k.toFixed(3));
      if (k >= 1) setSlot(i, 3);
    });
  }

  /* ---------- 화면 전환 ---------- */
  function enterGame() {
    const c = CHARS.find(x => x.id === sel);
    $('#heroImg').src = c.src;
    session = 0; renderScore(false);
    scene = 0; hero.u = 0.45; hero.v = 0.88; target = null; pending = false; transitioning = false;
    imgs.forEach((im, i) => im.hidden = i !== 0);
    slots.forEach((p, i) => { p.el.hidden = true; setSlot(i, 0); });
    patchEl.hidden = true;
    start.hidden = true; play.hidden = false;
    playing = true; lastT = performance.now();
    layout();
    speak('오른쪽 끝으로 가면 밭이 나와요', 3200);
    clearInterval(tickTimer); tickTimer = setInterval(tick, 100);
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame);
  }
  function leaveGame() {
    playing = false; clearInterval(tickTimer); cancelAnimationFrame(rafId);
    play.hidden = true; start.hidden = false; showBest();
  }
  $('#goBtn').addEventListener('click', enterGame);
  $('#backBtn').addEventListener('click', leaveGame);
  addEventListener('resize', () => { if (playing) layout(); });

  /* ---------- PWA ---------- */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
